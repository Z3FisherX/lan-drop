<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <meta name="referrer" content="same-origin">
  <title>投递文件 · LAN Drop</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/inbox.css">
  <script src="/inbox-guest.js" defer></script>
</head>
<body>
  <div class="shell guest-shell">
    <header class="topbar">
      <div class="brand"><img src="/favicon.svg" alt="" width="26" height="26">LAN Drop</div>
    </header>

    <main>
      <h1>投递文件</h1>
      <section class="card guest-card" aria-label="上传文件">
        <p id="guest-status" class="notice" role="status">正在确认投递链接…</p>
        <div id="guest-controls" hidden>
          <input type="file" id="file-input" multiple hidden>
          <div class="chooser">
            <button class="button primary" type="button" id="choose-files">选择文件并上传</button>
            <p class="hint" id="guest-limit"></p>
          </div>
        </div>
        <ul class="file-list upload-list" id="upload-list" aria-label="上传记录" hidden></ul>
        <p class="sr-only" id="upload-announcement" role="status"></p>
      </section>
    </main>
  </div>
</body>
</html>
